#cloud-config
# Cloud-init 설정 — VM 첫 부팅 시 자동 적용

hostname: ${hostname}
manage_etc_hosts: true
fqdn: ${hostname}.local

# ─── 네트워크 설정 ────────────────────────────────────────────────────────────
network:
  version: 2
  ethernets:
    ens32:                      # 템플릿 VM의 NIC 이름
      dhcp4: false
      addresses:
        - ${ip_address}/${netmask}
      routes:
        - to: 0.0.0.0/0
          via: ${gateway}
      nameservers:
        addresses:
%{ for dns_server in dns_servers ~}
          - ${dns_server}
%{ endfor ~}

# ─── SSH 설정 ─────────────────────────────────────────────────────────────────
ssh_pwauth: true                # 비밀번호 SSH 로그인 허용

# ─── 시스템 초기 설정 ─────────────────────────────────────────────────────────
runcmd:
  - systemctl restart NetworkManager
  - hostnamectl set-hostname ${hostname}
